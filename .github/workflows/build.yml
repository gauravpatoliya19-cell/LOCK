name: Build and Release Android APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'
        cache: 'gradle'

    - name: Grant Execute Permission for Gradle Wrapper
      run: chmod +x gradlew

    - name: Build Debug APK
      run: ./gradlew assembleDebug --no-daemon --stacktrace

    - name: Prepare APK for Artifact
      run: |
        mkdir -p release_apk
        cp app/build/outputs/apk/debug/app-debug.apk release_apk/AppLock-Fingerprint-PIN.apk

    - name: Upload APK as GitHub Actions Artifact
      uses: actions/upload-artifact@v4
      with:
        name: AppLock-Fingerprint-PIN-APK
        path: release_apk/AppLock-Fingerprint-PIN.apk
        retention-days: 30
