name: Build Android APK and AAB Bundle

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK & AAB
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'
        cache: 'gradle'

    - name: Grant Execute Permission for Gradle Wrapper
      run: chmod +x gradlew

    - name: Build Debug APK and AAB App Bundle
      run: ./gradlew assembleDebug bundleDebug --no-daemon --stacktrace

    - name: Prepare Outputs for Artifacts
      run: |
        mkdir -p release_output
        cp app/build/outputs/apk/debug/app-debug.apk release_output/AppLock-Fingerprint-PIN.apk
        cp app/build/outputs/bundle/debug/app-debug.aab release_output/AppLock-Fingerprint-PIN.aab

    - name: Upload APK as GitHub Actions Artifact
      uses: actions/upload-artifact@v4
      with:
        name: AppLock-Fingerprint-PIN-APK
        path: release_output/AppLock-Fingerprint-PIN.apk
        retention-days: 30

    - name: Upload AAB Bundle as GitHub Actions Artifact
      uses: actions/upload-artifact@v4
      with:
        name: AppLock-Fingerprint-PIN-AAB
        path: release_output/AppLock-Fingerprint-PIN.aab
        retention-days: 30
